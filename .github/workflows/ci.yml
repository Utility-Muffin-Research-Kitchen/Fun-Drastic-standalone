name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n package-mlp1.sh
          bash -n config/mlp1/launch.sh
          bash -n scripts/smoke-launch-wrapper.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck package-mlp1.sh config/mlp1/launch.sh \
            scripts/smoke-launch-wrapper.sh

      - name: Validator syntax
        run: python3 -m py_compile scripts/validate-package.py

      # The upstream archive is not published, so CI cannot build a package.
      # The wrapper is exercised against a synthetic package instead, which is
      # where every UMRK-authored behavior lives.
      - name: Launch wrapper smoke test
        run: make smoke-launch-wrapper
